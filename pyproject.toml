[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uds-mcp"
version = "0.1.0"
description = "MCP server for ISO 14229 (UDS) automotive diagnostics over CAN"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Zeus Epardo" }]
keywords = ["uds", "iso-14229", "mcp", "automotive", "can", "diagnostics"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: System :: Hardware",
]
dependencies = [
  "mcp>=1.0",
  "python-can>=4.3",
  "can-isotp>=2.0",
  "udsoncan>=1.26",
  "pydantic>=2.0",
]

[project.optional-dependencies]
pcan = []                      # python-can ships the PCAN backend; vendor driver required
intrepid = ["python-ics>=911"]
vector = []                    # python-can ships the Vector backend; XL driver required
testplan = ["openpyxl>=3.1"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
uds-mcp = "uds_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/zeus-epardo/UDS-MCP"
Issues = "https://github.com/zeus-epardo/UDS-MCP/issues"

[tool.hatch.build.targets.wheel]
packages = ["uds_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
